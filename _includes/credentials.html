<section class="section credentials" id="credentials">
  <div class="container">
    <div class="section__head reveal">
      <span class="eyebrow">Credentials</span>
      <h2 class="section-title">Certifications &amp; <em>memberships</em></h2>
    </div>

    {% assign certs = site.data.credentials %}
    <ul class="cred-grid reveal">
      {% for c in certs %}
        <li class="cred-card">
          <div class="cred-card__badge">
            {% include picture.html src=c.img alt=c.name loading="lazy" thumb=true %}
          </div>
          <div class="cred-card__body">
            <h3 class="cred-card__name">{{ c.name }}</h3>
            <p class="cred-card__issuer">{{ c.issuer }}{% if c.year %} · {{ c.year }}{% endif %}</p>
          </div>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
