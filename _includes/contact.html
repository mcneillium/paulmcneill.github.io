<!-- Contact -->
<section id="contact" class="contact-modern">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-lg-offset-1">
        <div class="contact-card">
          <div class="text-center">
            <h2 class="section-heading">Let’s Connect</h2>
            <p class="section-subheading">Collaborations, consulting, or just a hello.</p>
          </div>

          <form id="contactForm" class="contact-form" novalidate>
            <!-- Honeypot (anti-bot) -->
            <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="row">
              <div class="col-sm-6">
                <div class="fld">
                  <input id="name" name="name" type="text" required>
                  <label for="name">Your Name *</label>
                  <span class="bar"></span>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="fld">
                  <input id="email" name="email" type="email" required>
                  <label for="email">Your Email *</label>
                  <span class="bar"></span>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="fld">
                  <input id="phone" name="phone" type="tel">
                  <label for="phone">Phone (optional)</label>
                  <span class="bar"></span>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="fld">
                  <input id="subject" name="subject" type="text">
                  <label for="subject">Subject (optional)</label>
                  <span class="bar"></span>
                </div>
              </div>
              <div class="col-sm-12">
                <div class="fld">
                  <textarea id="message" name="message" rows="4" required></textarea>
                  <label for="message">Your Message *</label>
                  <span class="bar"></span>
                </div>
              </div>

              <div class="col-sm-12 consent">
                <label class="checkbox-inline">
                  <input type="checkbox" id="consent" required> I consent to being contacted about this inquiry.
                </label>
                <small class="privacy">No spam. I’ll only use your details to reply. </small>
              </div>

              <div class="col-sm-12 text-center">
                <button id="submitBtn" type="submit" class="btn btn-primary btn-lg">
                  <span class="btn-text">Send</span>
                  <span class="spinner" aria-hidden="true"></span>
                </button>
                <div id="status" class="status" aria-live="polite"></div>
              </div>
            </div>
          </form>

        <div class="quick-links text-center">
        <a href="mailto:hello@yourdomain.com" class="mini-link"><i class="fa-solid fa-envelope"></i> Email</a>
        <a href="https://www.linkedin.com/in/your-handle" target="_blank" rel="noopener" class="mini-link"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
        <a href="https://github.com/your-handle" target="_blank" rel="noopener" class="mini-link"><i class="fa-brands fa-github"></i> GitHub</a>
        </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Scoped styles -->
  <style>
    .contact-modern { 
      padding: 80px 0; 
      background: radial-gradient(1200px 600px at 10% 10%, rgba(0,0,0,0.05), transparent),
                  radial-gradient(1000px 500px at 90% 20%, rgba(0,0,0,0.04), transparent);
    }
    .contact-card {
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      padding: 32px 28px;
      backdrop-filter: blur(6px);
    }
    .section-heading { margin-top: 0; margin-bottom: 8px; }
    .section-subheading { margin-bottom: 28px; color: #6c757d; }

    .fld { position: relative; margin-bottom: 22px; }
    .fld input, .fld textarea {
      width: 100%;
      padding: 16px 12px 10px 12px;
      background: #fff; border: 1px solid #e6e6e6; border-radius: 10px;
      outline: none; transition: border .2s, box-shadow .2s;
    }
    .fld textarea { resize: vertical; }
    .fld input:focus, .fld textarea:focus { border-color: #2c9fda; box-shadow: 0 0 0 3px rgba(44,159,218,0.12); }
    .fld label {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      background: transparent; padding: 0 6px; color: #8a8f98; pointer-events: none;
      transition: all .15s ease;
    }
    .fld textarea + label { top: 18px; transform: none; }
    .fld input:focus + label, .fld input:not(:placeholder-shown) + label,
    .fld textarea:focus + label, .fld textarea:not(:placeholder-shown) + label {
      top: -9px; left: 10px; background: #fff; font-size: 12px; color: #2c9fda;
    }
    /* fallback for no placeholder attr */
    .fld input:not([value=""]):not(:focus) + label { top: -9px; font-size: 12px; background: #fff; }

    .bar { display: none; } /* decorative in classic templates — hidden for modern look */

    .consent { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
    .privacy { color: #8a8f98; }

    .btn .spinner {
      display: none; width: 16px; height: 16px; margin-left: 8px;
      border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }
    .btn.loading .btn-text { opacity: .7; }

    .status { margin-top: 14px; min-height: 22px; font-weight: 500; }
    .status.success { color: #2c9f68; }
    .status.error { color: #d9534f; }

    .quick-links { margin-top: 18px; }
    .mini-link { display: inline-block; margin: 0 10px; color: #6c757d; }
    .mini-link i { margin-right: 6px; }
    .hp { position: absolute; left: -10000px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* tighten vertical space on large screens */
    @media (min-width: 1200px){
      .contact-card { padding: 36px 40px; }
    }
  </style>
</section>

<!-- EmailJS (keep near the end of body) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // Init EmailJS
  emailjs.init("XYhin_65Pmjh4JBLh"); // your Public Key

  // Minimal, accessible handler
  (function(){
    var form = document.getElementById('contactForm');
    var status = document.getElementById('status');
    var submitBtn = document.getElementById('submitBtn');

    // Floating label fallback for older browsers
    Array.prototype.forEach.call(form.querySelectorAll('.fld input, .fld textarea'), function(el){
      el.setAttribute('placeholder',' ');
    });

    form.addEventListener('submit', function(e){
      e.preventDefault();

      // Honeypot check
      if (form.website && form.website.value) return;

      if (!form.checkValidity()){
        status.className = 'status error';
        status.textContent = 'Please complete the required fields.';
        return;
      }

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      status.className = 'status';
      status.textContent = '';

      emailjs.sendForm('service_oji1zfq', 'template_nyq923q', '#contactForm')
        .then(function(){
          status.className = 'status success';
          status.textContent = 'Thanks — your message has been sent!';
          form.reset();
        })
        .catch(function(err){
          status.className = 'status error';
          status.textContent = 'Hmm, something went wrong. Please try again or email me directly.';
          console.error(err);
        })
        .finally(function(){
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
        });
    });
  })();
</script>
