<!-- ====== Navbar Behavior Fixes ====== -->
<script>
(function () {
  // Shrink navbar on scroll
  var nav = document.querySelector('.navbar-default');
  if (nav) {
    function onScroll() {
      if (window.scrollY > 80) nav.classList.add('navbar-shrink');
      else nav.classList.remove('navbar-shrink');
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  }

  // Auto-close mobile menu on click, scroll, or outside tap
  var collapse = document.querySelector('.navbar-collapse');
  function hideMenu() {
    if (typeof $ !== 'undefined' && $('.navbar-collapse').hasClass('in')) {
      $('.navbar-collapse').collapse('hide');
    }
  }

  // 1. Close on nav link click
  document.addEventListener('click', function (e) {
    var link = e.target.closest('.navbar-collapse a');
    if (link && !link.classList.contains('dropdown-toggle')) hideMenu();
  }, { passive: true });

  // 2. Close on scroll
  window.addEventListener('scroll', hideMenu, { passive: true });

  // 3. Close on tap outside
  document.addEventListener('click', function (e) {
    var nav = document.querySelector('.navbar');
    if (!nav) return;
    var clickedInside = nav.contains(e.target);
    if (!clickedInside && $('.navbar-collapse').hasClass('in')) hideMenu();
  }, { passive: true });
})();
</script>
<!-- ====== End Navbar Behavior Fixes ====== -->
