<footer class="footer">
  <div class="container footer__inner">
    <p style="margin: 0;">© {{ site.time | date: "%Y" }} Paul Martin McNeill. Built from scratch.</p>
    <ul class="footer__links">
      {% for s in site.social %}
        {% if s.title == "github" or s.title == "linkedin" %}
          <li><a href="{{ s.url }}" target="_blank" rel="noopener">{{ s.title | capitalize }}</a></li>
        {% endif %}
      {% endfor %}
      <li><a href="{{ '/cv/' | relative_url }}">CV</a></li>
    </ul>
  </div>
</footer>
