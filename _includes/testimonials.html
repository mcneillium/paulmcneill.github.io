<!-- VERIFY: testimonials in _data/testimonials.yml are placeholders pending real attributions. -->
<section class="section testimonials" id="testimonials">
  <div class="container">
    <div class="section__head reveal">
      <span class="eyebrow">What People Say</span>
      <h2 class="section-title">Words from <em>collaborators</em></h2>
    </div>

    <div class="testimonials__grid">
      {% for t in site.data.testimonials %}
        <figure class="testimonial reveal" style="--delay: {{ forloop.index0 | times: 100 }}ms">
          {% include icon.html name="quote" class="testimonial__quote-mark" %}
          <blockquote class="testimonial__quote">{{ t.quote }}</blockquote>
          <figcaption class="testimonial__attr">
            {%- if t.name -%}
              <strong class="testimonial__name">{{ t.name }}</strong>
            {%- endif -%}
            <span class="testimonial__role">{{ t.role }}</span>
            {% if t.org %}<span class="testimonial__org">{{ t.org }}</span>{% endif %}
            {% unless t.verified %}<span class="testimonial__pending" title="Placeholder until written permission to attribute is on file">Placeholder</span>{% endunless %}
          </figcaption>
        </figure>
      {% endfor %}
    </div>
  </div>
</section>
