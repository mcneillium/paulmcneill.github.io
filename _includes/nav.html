<header class="nav" id="nav">
  <div class="container nav__inner">
    <a href="#page-top" class="brand" aria-label="Paul McNeill — home">paul<span class="dot">.</span></a>

    {% if site.available %}
      <span class="status-pill" title="Currently open to opportunities">
        <span class="status-pill__dot" aria-hidden="true"></span>
        <span class="status-pill__text">Available</span>
      </span>
    {% endif %}

    <div class="accent-picker" id="accentPicker">
      <button class="accent-picker__btn" id="accentToggle" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="accentPanel"
              aria-label="Change accent colour">
        {% include icon.html name="palette" class="icon" %}
      </button>
      <div class="accent-picker__panel" id="accentPanel" role="dialog" aria-label="Accent colour">
        <span class="accent-picker__label">Accent</span>
        <div class="accent-picker__swatches" role="radiogroup" aria-label="Accent colour">
          <!-- Populated by accent.js — keeps the preset table in one place -->
        </div>
      </div>
    </div>

    <div class="font-picker" id="fontPicker">
      <button class="font-picker__btn" id="fontToggle" type="button"
              aria-haspopup="true" aria-expanded="false" aria-controls="fontPanel"
              aria-label="Change typography">Aa</button>
      <div class="font-picker__panel" id="fontPanel" role="dialog" aria-label="Font theme">
        <span class="font-picker__label">Typography</span>
        <ul class="font-picker__list" role="radiogroup" aria-label="Font theme">
          <!-- Populated by fonts.js — keeps the preset table in one place -->
        </ul>
      </div>
    </div>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark theme">
      <span class="theme-toggle__icon theme-toggle__icon--sun">{% include icon.html name="sun" class="icon" %}</span>
      <span class="theme-toggle__icon theme-toggle__icon--moon">{% include icon.html name="moon" class="icon" %}</span>
    </button>

    <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span>
    </button>

    <ul class="nav__links" id="navLinks">
      <li><a href="#expertise">Expertise</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#aiml">AI &amp; ML</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#credentials">Credentials</a></li>
      <li><a href="#contact" class="cta">Get in touch</a></li>
    </ul>
  </div>
</header>
