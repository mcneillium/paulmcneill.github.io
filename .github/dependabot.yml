version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/workers/portfolio-bot"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3

  - package-ecosystem: "bundler"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
