# The full URL of your site
url: "https://paulmartinmcneill.com"
# The subpath of your site if it's hosted in a subdirectory
baseurl: ""

# Site settings
# The title of your site
title: "Paul Martin McNeill's Portfolio"
email: paulmcneill1989@hotmail.co.uk
# A brief description of your site
description: "Welcome to my portfolio. Here you can find my latest projects and learn more about my expertise in web development, AI, and more."

# Profile / status
profile:
  name: "Paul Martin McNeill"
  short_name: "Paul McNeill"
  location: "Northern Ireland, UK"
  github_user: "mcneillium"
  twitter_handle: "McNeillium"
available: true

# Chatbot — set the deployed Cloudflare Worker URL here. Empty string
# falls back to the offline keyword-only mode that uses the structured
# data already on the page.
chatbot:
  endpoint: "https://portfolio-bot.paulmartinmcneill.workers.dev"

# Social networks
social:
  - title: twitter
    url: https://x.com/McNeillium
  - title: linkedin
    url: https://www.linkedin.com/in/paul-martin-mcneill-pp
  - title: github
    url: https://github.com/mcneillium
  - title: huggingface
    url: https://huggingface.co/McNeillium
  - title: stack-overflow
    url: https://stackoverflow.com/users/mcneillium
  - title: facebook
    url: https://www.facebook.com/McNeillium/
  - title: youtube
    url: https://www.youtube.com/@McNeillium_AI

# Build settings
markdown: kramdown
permalink: pretty

# Don't publish project / dev docs
exclude:
  - CLAUDE.md
  - README.md
  - docs/
  - scripts/
  - workers/
  - node_modules/
  - vendor/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
