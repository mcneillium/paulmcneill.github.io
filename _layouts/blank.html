<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} – Paul Martin McNeill</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign base = site.baseurl | default: "" -%}

  <!-- Favicon (optional) -->
  <link rel="icon" href="{{ base }}/img/favicon.ico">

  <!-- Core CSS: Bootstrap + your theme (adjust paths if your repo differs) -->
  <link rel="stylesheet" href="{{ base }}/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ base }}/css/agency.css">
  <!-- Font Awesome (if used) -->
  <link rel="stylesheet" href="{{ base }}/font-awesome/css/font-awesome.min.css">

  <!-- Google Fonts (optional) -->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Kaushan+Script" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet">
</head>
<body id="page-top" class="index">

  {# Uncomment to show your global nav on the CV page #}
  {%- comment -%}{% include nav.html %}{%- endcomment -%}

  <!-- CV content -->
  <main role="main">
    {{ content }}
  </main>

  {# Uncomment if you want the global footer #}
  {%- comment -%}{% include footer.html %}{%- endcomment -%}

  <!-- JS (end of body) -->
  <script src="{{ base }}/js/jquery.min.js"></script>
  <script src="{{ base }}/js/bootstrap.min.js"></script>
  <script src="{{ base }}/js/jqBootstrapValidation.js"></script>
  <script src="{{ base }}/js/agency.js"></script>
</body>
</html>
