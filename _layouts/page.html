<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body id="page-top" class="page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="scroll-progress" aria-hidden="true"></div>
  {% include nav.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <a href="#page-top" class="back-to-top" aria-label="Back to top">
    {% include icon.html name="chevron-up" class="icon" %}
  </a>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/accent.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/fonts.js' | relative_url }}" defer></script>
  {%- if page.scripts -%}
    {%- for s in page.scripts %}
  <script src="{{ s | relative_url }}" defer></script>
    {%- endfor -%}
  {%- endif %}
</body>
</html>
