- key: water
  label: Water networks
  title: From night flows to a weekly plan.
  project: Leakage Intelligence Platform
  url: /projects/leakage-intelligence-platform/
  image: /img/portfolio/leakage-platform.webp
  alt: Diagram of the leakage intelligence platform's weekly flow
  summary: Follow a week of network data from raw flows to where detection crews go next.
  stages:
    - title: Weekly inputs
      subtitle: Flow / repairs / weather
      icon: database
      detail: Night-time flows for more than 1,250 metered areas arrive each week with repair, asset and weather data. The data is noisy, irregular and incomplete, so it is cleaned and checked for anomalies before anything is modelled.
    - title: Forecast & score
      subtitle: LightGBM / LSTM / survival
      icon: cpu
      detail: Models forecast leakage 4 to 52 weeks ahead, estimate burst risk and score every area's health. Each model is tested at rolling forecast origins against simple baselines before it is trusted.
    - title: Weekly plan
      subtitle: Web app / reports
      icon: eye
      detail: A 25-page web application turns the results into maps, priorities and a schedule for detection teams. The utility's data is not published; the case study describes the system and my role.
- key: care
  label: Healthcare
  title: Care data, connected.
  project: Aurora Domiciliary Care
  url: /projects/aurora-nhs-transformation/
  image: /img/portfolio/aurora/aurora_dashboard_ops_pbi.webp
  alt: Aurora Power BI operations dashboard
  summary: Follow a care record from source tables to an operational dashboard.
  stages:
    - title: Source records
      subtitle: Access / SQL / Excel
      icon: database
      detail: Client records, visits, runs and rotas, workforce and finance data form the source layer. Aurora uses a synthetic dataset to demonstrate a Northern Ireland care model.
    - title: Transform & model
      subtitle: Power Query / DAX
      icon: code
      detail: Power Query cleans and prepares the tables. The data model connects them, while DAX measures turn visit and finance records into reportable indicators.
    - title: Operational insight
      subtitle: Power BI
      icon: eye
      detail: Dashboards bring together missed visits, workforce, finance and compliance, with locality views and mobile layouts.
- key: aac
  label: Accessibility
  title: A thought becomes a voice.
  project: AI-Powered AAC App
  url: /projects/ai-aac-app/
  image: /img/portfolio/aac-ai-dashboard.webp
  alt: AI-powered assistive communication dashboard
  summary: Explore the path from communication input to a caregiver view.
  stages:
    - title: Communication input
      subtitle: Mobile interface
      icon: sparkles
      detail: The mobile app gives non-verbal users a way to express their needs. The project explores scene understanding and context to support communication.
    - title: Predictive assistance
      subtitle: On-device prediction
      icon: cpu
      detail: Predictive AI suggests communication options. The system combines on-device prediction with an accessible mobile interface.
    - title: Caregiver connection
      subtitle: Firebase / Dashboard
      icon: globe
      detail: A connected caregiver dashboard provides a real-time view alongside the mobile experience. Read the case study for the interface and implementation.
- key: assistant
  label: AI workflows
  title: From a dataset to a reply.
  project: AI Assistant (fine-tuned GPT-2)
  url: /projects/ai-assistant/
  image: /img/portfolio/ai-assistant/training-run.webp
  alt: Terminal during the GPT-2 fine-tuning run
  summary: Follow a fine-tuned language model from training data to an answer on screen.
  stages:
    - title: Training data
      subtitle: ConvAI2 + custom dialogues
      icon: database
      detail: Public dialogue data from Hugging Face is combined with custom support-style conversations and tokenised for GPT-2.
    - title: Fine-tuning
      subtitle: Transformers / PyTorch
      icon: cpu
      detail: GPT-2 is fine-tuned as a causal language model with the Hugging Face Trainer on a local GPU.
    - title: Serving
      subtitle: Flask / Tkinter / Streamlit
      icon: code
      detail: A Flask API generates replies with nucleus sampling, and web, desktop and Streamlit interfaces all use the same model.
