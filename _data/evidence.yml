# Homepage "Evidence" cards. Every figure is taken from /research/ and must
# match it. If a figure changes there, change it here in the same commit.

- question: "Is the result real?"
  figure: "0.14"
  unit: "R² from noise"
  finding: >-
    Choosing a model's inputs before testing it scored 0.14 on shuffled data
    with nothing to find. That is as high as the real result. Done in the
    right order, the same recipe scored below zero.
  anchor: "drug-response"

- question: "How much does gene expression add?"
  figure: "5% to 19%"
  unit: "of the response explained"
  finding: >-
    PTEN alone explained about 5% of the variation in how cell lines
    responded to ipatasertib. The best model explained about 19%.
  anchor: "drug-response"

- question: "Can anyone act on it?"
  figure: "75 to 80%"
  unit: "false alarms"
  finding: >-
    Three and seven days ahead, 75 to 80% of the model's high-river warnings
    were wrong. A band drawn around today's flow, with no model at all, came
    close: 0.155 against 0.175 on the same score at seven days.
  anchor: "river-early-warning"

- question: "How well does a river forecast travel?"
  figure: "0.850 to 0.752"
  unit: "skill, wet to dry"
  finding: >-
    Holding out a whole region cost little at one day. The bigger loss came
    on drier catchments when the model had only trained on wetter ones.
  anchor: "river-early-warning"

- question: "Does the explanation hold?"
  figure: "0.20"
  unit: "overlap between refits"
  finding: >-
    Refit the same model on a slightly different sample and its list of the
    20 most important inputs changes. On average two refits share about a third of their lists (an
    overlap score of 0.20). Only two inputs stayed near the top.
  anchor: "drug-response"

- question: "Which model copied the most labelling mistakes?"
  figure: "90.0%"
  unit: "of the pixels wrongly labelled as water"
  finding: >-
    On 90 held-out image chips, frozen TerraMind repeated 90.0% of the pixels
    wrongly labelled as water. That rose to 96.2% when its encoder was
    updated. The UNet trained from scratch repeated 75.0%.
  anchor: "flood-label-errors"

- question: "Can a drop in night flow tell us when a leak was repaired?"
  figure: "3 of 7"
  unit: "recorded repairs found"
  finding: >-
    The three-night rule found 3 of 7 recorded repairs in 2019. The
    seven-night rule found 6 of 7. Every flag from either rule matched a
    repair.
  anchor: "leak-repair-labels"
