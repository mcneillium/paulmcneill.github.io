bio_short: >-
  AI engineer, web developer and data analyst based on the island of Ireland,
  with over 15 years across IT, data and engineering. Builds machine learning
  forecasting tools, web platforms and analytics for water infrastructure,
  healthcare, accessibility and day-to-day operations. Studying for an MSc in
  Artificial Intelligence at Queen’s University Belfast (due 2027); holds a
  First-Class BSc (Hons) in Computer Science from The Open University and has
  completed M816 Data Management, a postgraduate Open University module.

bio_long: >-
  AI engineer, web developer and data analyst with over 15 years across
  IT, database systems and applied data work. On a consultancy contract
  with a UK water utility, builds the platform and machine learning models
  used to forecast leakage across more than 1,250 district metered areas.
  Other work includes care analytics and an AI-enhanced care app on synthetic data, AI
  accessibility tools such as a predictive AAC app for non-verbal users,
  and two reproducible research studies on public data. Studying for an MSc
  in Artificial Intelligence at Queen’s University Belfast (due 2027); holds
  a First-Class BSc (Hons) in Computer Science from The Open University (2025) and
  has completed the Open University’s postgraduate M816 Data Management
  module. Works with
  Python, deep learning and data engineering, including TensorFlow,
  PyTorch and scikit-learn, and cloud platforms including GCP, AWS
  and Azure.

