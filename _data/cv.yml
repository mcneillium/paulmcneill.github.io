research:
  - title: "River early warning across 671 British catchments"
    when: "2026"
    url: "/research/#river-early-warning"
    code: "https://github.com/mcneillium/river-early-warning"
    text: "Reproducible study on CAMELS-GB: forecasting river flow and flood and low-flow warnings 1 to 7 days ahead without future weather. An LSTM trained on wetter catchments transferred to drier ones much worse than gradient boosting; calibrated forecast ranges under-covered in winter; a general time-series foundation model (Chronos-2) used without training stayed well below trained models."
  - title: "Drug response beyond a single marker"
    when: "2026"
    url: "/research/#drug-response"
    code: "https://github.com/mcneillium/drug-response-beyond-marker"
    text: "Reproducible study on GDSC (924 cancer cell lines): how much wider gene data adds to PTEN status, a measured feature-selection leak, and the stability of clusters and explanations."
research_note: "Protocol fixed before any model was fitted, baselines first, fingerprinted splits, a public log of every decision and correction. Built making use of AI tools under research rules I set; re-run on my own hardware. Not yet peer reviewed."

