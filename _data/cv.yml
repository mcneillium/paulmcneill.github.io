headline: "Digital solutions developer and AI consultant · MSc Artificial Intelligence student, Queen's University Belfast"
location: "Northern Ireland"

profile: >-
  Developer, AI consultant and MSc Artificial Intelligence student applying
  machine learning to real-world water infrastructure data. On a consultancy
  contract with a UK water utility, I build and maintain the platform and
  models that forecast leakage across more than 1,250 district metered areas,
  using flow, weather and operational data that are noisy, irregular and
  incomplete, and producing results that must be explainable to a regulator.
  I hold a First-Class BSc (Hons) in Computing and am seeking a PhD in machine
  learning for imperfect, multisource real-world data.

interests: >-
  Machine learning with incomplete, heterogeneous and multisource data;
  environmental and infrastructure time series; forecasting under seasonal and
  regional distribution shift; uncertainty estimation; explainable models that
  support real decisions.

