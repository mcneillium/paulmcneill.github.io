# Testimonials.
#
# Each entry has:
#   quote     — the testimonial text (required)
#   name      — full name of the person endorsing (set when permission is granted)
#   role      — their role at time of quote
#   org       — their employer / organisation
#   avatar    — optional path to a photo (null is fine)
#   verified  — boolean. Stays false until you have written permission to publish.
#
# Workflow when collecting a real quote:
#   1. Reach out to the named contact, share the proposed wording, get sign-off.
#   2. Add their real name to `name`. (Until then, the role + org alone is shown.)
#   3. Flip `verified: true`. The "Placeholder" pill disappears in the UI.
#
# The pill is intentional — better to show "Placeholder" than to ship fake
# attributions as real. Don't flip `verified: true` for any entry where the
# person hasn't actually approved the quote.

